---
name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Check Renovate secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets
        id: check
        env:
          RENOVATE_APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RENOVATE_APP_CLIENT_ID}" && -n "${RENOVATE_APP_PRIVATE_KEY}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "RENOVATE_APP_CLIENT_ID or RENOVATE_APP_PRIVATE_KEY is unset; skipping Renovate."
          fi

  renovate:
    name: Renovate
    needs:
      - secrets
    if: ${{ needs.secrets.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Minted from the GitHub App Joel installs. Repository secrets:
      # RENOVATE_APP_CLIENT_ID, RENOVATE_APP_PRIVATE_KEY.
      # The app needs Contents, Issues, and Pull requests (read and write),
      # plus Workflows (read and write) so config:recommended can update
      # action pins. PRs opened with this token trigger Actions; GITHUB_TOKEN
      # does not.
      - name: Get token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          LOG_LEVEL: info
          RENOVATE_ONBOARDING: false
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: optional
        with:
          token: ${{ steps.app-token.outputs.token }}
