---
name: App Builder

on:
  workflow_call:
    inputs:
      app:
        description: App directory under apps/
        required: true
        type: string
      release:
        description: Push the image to GHCR
        required: true
        type: boolean

# Permissions are set on the calling job. A pull request grants contents: read.
# The release job also grants packages: write, which is what pushes to GHCR.
# A permissions block in this file would either drop that grant or ask pull
# requests for packages: write.

jobs:
  build:
    name: Build ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Read App Metadata
        id: app
        env:
          APP: ${{ inputs.app }}
        shell: bash
        run: |
          set -euo pipefail

          app_dir="apps/${APP}"
          bake_file="${app_dir}/docker-bake.hcl"
          if [[ ! -f "${bake_file}" ]]; then
            echo "Missing ${bake_file}" >&2
            exit 1
          fi

          vars="$(docker buildx bake --file "${bake_file}" --list type=variables,format=json)"
          version="$(jq -r '.[] | select(.name == "VERSION") | .value' <<< "${vars}")"
          source="$(jq -r '.[] | select(.name == "SOURCE") | .value' <<< "${vars}")"
          upstream_ref="$(jq -r '.[] | select(.name == "UPSTREAM_REF") | .value' <<< "${vars}")"
          upstream_short="${upstream_ref:0:12}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "VERSION is required in ${bake_file}" >&2
            exit 1
          fi

          echo "image=ghcr.io/${owner}/${APP}" >> "${GITHUB_OUTPUT}"
          echo "source=${source}" >> "${GITHUB_OUTPUT}"
          echo "upstream-ref=${upstream_ref}" >> "${GITHUB_OUTPUT}"
          echo "upstream-short=${upstream_short}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        if: ${{ inputs.release }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          images: ${{ steps.app.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.app.outputs.image }}
            org.opencontainers.image.version=${{ steps.app.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.documentation=${{ steps.app.outputs.source }}
          tags: |
            type=raw,value=rolling,enable=${{ inputs.release }}
            type=raw,value=${{ steps.app.outputs.version }},enable=${{ inputs.release }}
            type=raw,value=upstream-${{ steps.app.outputs.upstream-short }},enable=${{ inputs.release }}
            type=sha,prefix=sha-,enable=${{ inputs.release }}
            type=raw,value=pr,enable=${{ !inputs.release }}

      - name: Build
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # The build record artifact needs actions: write. Pull requests grant
          # contents: read only, so keep the record off and use the job summary.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: |
            ./apps/${{ inputs.app }}/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          set: |
            *.context=./apps/${{ inputs.app }}
            image-all.output=${{ inputs.release && 'type=registry' || 'type=cacheonly' }}
          targets: image-all
          push: ${{ inputs.release }}
          provenance: ${{ inputs.release }}
          sbom: ${{ inputs.release }}

      - name: Record index digest
        if: ${{ inputs.release }}
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE: ${{ steps.app.outputs.image }}
          VERSION: ${{ steps.app.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          digest="$(jq -r '
            if ."image-all"["containerimage.digest"] then
              ."image-all"["containerimage.digest"]
            else
              [.. | objects | select(has("containerimage.digest")) | .["containerimage.digest"]][0] // empty
            end
          ' <<< "${METADATA}")"
          if [[ -z "${digest}" || "${digest}" == "null" ]]; then
            echo "Build metadata did not include an index digest" >&2
            printf '%s\n' "${METADATA}" >&2
            exit 1
          fi

          {
            echo "### Index digest"
            echo ""
            echo "Pin downstream manifests to the version tag. \`rolling\` moves."
            echo ""
            echo '```text'
            echo "${IMAGE}:${VERSION}@${digest}"
            echo '```'
            echo ""
            echo "Tags pushed to that index:"
            echo ""
            jq -r --arg digest "${digest}" '
              (
                ."image-all"["image.name"] // ""
                | split(",")
                | map(select(length > 0))
                | unique
                | .[]
              ) as $ref
              | "- `\($ref)@\($digest)`"
            ' <<< "${METADATA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Load platform images
        if: ${{ !inputs.release }}
        env:
          APP: ${{ inputs.app }}
        shell: bash
        run: |
          set -euo pipefail

          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            docker buildx bake \
              --file "apps/${APP}/docker-bake.hcl" \
              --set "image-all.context=./apps/${APP}" \
              --set "image-all.platform=${platform}" \
              --set "image-all.output=type=docker" \
              --set "image-all.tags=${APP}:${arch}" \
              image-all
          done

      - name: Smoke Test
        if: ${{ !inputs.release }}
        env:
          APP: ${{ inputs.app }}
        shell: bash
        run: |
          set -euo pipefail

          smoke_script="./apps/${APP}/smoke.sh"
          if [[ -f "${smoke_script}" ]]; then
            bash "${smoke_script}" "${APP}:amd64"
            bash "${smoke_script}" "${APP}:arm64"
          else
            docker run --rm --platform linux/amd64 "${APP}:amd64" --help
            docker run --rm --platform linux/arm64 --entrypoint node "${APP}:arm64" --version
            docker run --rm --platform linux/arm64 --entrypoint mcp-proxy "${APP}:arm64" --version
          fi
